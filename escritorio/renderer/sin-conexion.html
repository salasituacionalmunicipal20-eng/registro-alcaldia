<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sin conexion - Sala Situacional</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }
        .tarjeta {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 48px;
            max-width: 540px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .icono { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 28px; margin-bottom: 12px; color: #fbbf24; }
        p { font-size: 16px; line-height: 1.6; color: #cbd5e1; margin-bottom: 24px; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1d4ed8; }
        .pista { font-size: 13px; color: #94a3b8; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="icono">📡</div>
        <h1>Sin conexion a Internet</h1>
        <p>No fue posible cargar el panel de la Sala Situacional. Verifique su conexion a Internet y vuelva a intentarlo.</p>
        <button onclick="location.href='https://salasituacional.alcaldiadecharallave.com/'">Reintentar</button>
        <div class="pista">Si el problema persiste, contacte al administrador del sistema.</div>
    </div>
</body>
</html>
