<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados del formulario · Sala Situacional</title><link rel="stylesheet" href="formularios.css"><script src="autofresh.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><header class="cabecera"><div><strong>Sala Situacional</strong><small>Resultados de formularios</small></div><a href="admin.html">Volver al panel</a></header><main class="contenedor"><div id="carga" class="inicio-carga" role="status">Comprobando acceso…</div><div id="mensaje" class="mensaje" role="status" hidden></div><div id="contenido" hidden><div class="barra"><div><h1 id="titulo"></h1><p id="descripcion" class="muted"></p><span id="en-vivo" class="estado">Conectando…</span></div><div class="acciones"><button id="compartir-enlace">Copiar enlace del formulario</button><button id="excel">Descargar Excel</button><button id="pdf">Descargar PDF</button></div></div><div class="panel"><div class="barra"><h2>Filtros</h2><button id="limpiar">Limpiar filtros</button></div><div class="filtros"><div><label for="buscar">Buscar en todas las respuestas</label><input id="buscar" type="search" placeholder="Nombre, cédula o palabra…"></div><div><label for="desde">Registrado desde</label><input id="desde" type="date"></div><div><label for="hasta">Registrado hasta</label><input id="hasta" type="date"></div></div><div id="filtros" class="filtros" style="margin-top:18px"></div></div><div class="panel"><div id="resumen" class="resumen"></div><p id="seleccion-descripcion" class="filtro-descripcion"></p><div id="tabla" class="tabla-scr
