<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133a5c"><title>Asistencia Biblia | Alcaldía de Cristóbal Rojas</title><link rel="stylesheet" href="asistencia-biblia.css?v=20261029"><script src="territorio-data.js?v=20261015-milagro-i" defer></script><script src="autofresh.js"></script><script type="module" src="asistencia-biblia-formulario.mjs?v=20261029b"></script></head>
<body><header class="cabecera"><h1>Asistencia Biblia</h1><p>Alcaldía del Municipio Cristóbal Rojas</p></header><main class="contenido estrecho"><section class="panel"><h2>Registra tu asistencia</h2><p class="nota">Completa todos los datos para registrar tu asistencia.</p><form id="formulario" onsubmit="return false"><div class="campos"><div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required maxlength="80" autocomplete="given-name"></div><div class="campo"><label for="apellido">Apellido</label><input id="apellido" name="apellido" required maxlength="80" autocomplete="family-name"></div><div class="campo"><label for="cedula">Cédula</label><input id="cedula" name="cedula" required maxlength="10" inputmode="text" autocomplete="off" placeholder="Ejemplo: V12345678"><small>Escribe los números; puedes incluir V o E.</small></div><div class="campo"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" required maxlength="20" autocomplete="tel" inputmode="tel"></div><div class="campo"><label for="comunidad">Comunidad</label><input id="comunidad" name="comunidad" list="comunidades" required maxlength="120" autocomplete="address-level3"><datalist id="comunidades"></datalist><small>Selecciona una opción o escribe tu comunidad.</small></div><div class="campo"><label for="edad">Edad</label><input id="edad" name="edad" type="number" required min="0" max="120" step="1" inputmode="numeric"></div></div><p id="mensaje" class="mensaje" role="status" aria-live="polite">Preparando el formulario…</p><div class="acciones"><button id="enviar" type="submit" disabled>Registrar asistencia</button></div></form></section></main></body></html>
